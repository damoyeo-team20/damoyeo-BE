services:
  postgres:
    image: postgres:17-alpine
    container_name: damoyeo-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-damoyeo}
      POSTGRES_USER: ${POSTGRES_USER:-damoyeo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-damoyeo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - damoyeo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  damoyeo-postgres-data:
