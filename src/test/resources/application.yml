spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret
            redirect-uri: http://localhost:8080/test/oauth/callback
            scope:
              - openid
              - profile
              - email
              - https://www.googleapis.com/auth/calendar.events
              - https://www.googleapis.com/auth/calendar.freebusy
  datasource:
    url: jdbc:h2:mem:damoyeo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  oauth:
    login-success-uri: /api/auth/session
